# This is a placeholder secret for webhook certificates.
# It is created empty on initial deployment to avoid mount failures.
# The init container will populate it with valid certificates on first run.
apiVersion: v1
kind: Secret
metadata:
  name: webhook-server-cert
  namespace: system
type: kubernetes.io/tls
data:
  # Placeholder values - will be replaced by init container
  tls.crt: ""
  tls.key: ""
  ca.crt: ""
