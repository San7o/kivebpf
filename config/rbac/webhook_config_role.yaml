# This ClusterRole grants permissions to create and update webhook configurations.
# These permissions are required by the init container to dynamically create or update
# MutatingWebhookConfiguration and ValidatingWebhookConfiguration resources with the
# CA bundle from self-signed certificates. It also grants permissions to update CRD
# conversion webhook configurations from the CustomResourceDefinitions.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: webhook-config-role
rules:
- apiGroups:
  - admissionregistration.k8s.io
  resources:
  - mutatingwebhookconfigurations
  - validatingwebhookconfigurations
  verbs:
  - create
  - get
  - list
  - update
  - patch
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
  - list
  - update
  - patch
